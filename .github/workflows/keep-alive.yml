name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -s --max-time 120 -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s" \
            https://school-connect-6qt9.onrender.com/api/actuator/health || true

# Docker Profile Configuration
# This configuration is used when running in Docker containers

# Database Configuration - overridden by environment variables from docker-compose
# These use the environment variables set in docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Redis Configuration - overridden by environment variables from docker-compose
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=false

# Multi-Tenancy Configuration
multitenancy.master.datasource.url=${SPRING_DATASOURCE_URL}
multitenancy.master.datasource.username=${SPRING_DATASOURCE_USERNAME}
multitenancy.master.datasource.password=${SPRING_DATASOURCE_PASSWORD}
multitenancy.strategy=SCHEMA
multitenancy.default-tenant=public

# Logging
logging.level.root=INFO
logging.level.com.schoolmgmt=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
